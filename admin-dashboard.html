<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | PRIYANSHU ROADLINES</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        /* ============================================
           HEADER
        ============================================ */

        .header {
            background: #111;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #ff0000;
            font-size: 25px;
        }

        .header span {
            font-size: 14px;
            color: #ddd;
        }


        /* ============================================
           SIDEBAR
        ============================================ */

        .sidebar {
            position: fixed;

            top: 68px;
            left: 0;

            width: 230px;
            height: calc(100vh - 68px);

            background: #1c1c1c;

            padding-top: 20px;
        }

        .sidebar button {

            width: 100%;

            padding: 15px 20px;

            border: none;

            background: transparent;

            color: white;

            text-align: left;

            font-size: 15px;

            cursor: pointer;
        }

        .sidebar button:hover {
            background: #333;
        }

        .sidebar button.active {
            background: #e60000;
        }


        /* ============================================
           MAIN CONTENT
        ============================================ */

        .main {

            margin-left: 230px;

            padding: 30px;
        }


        /* ============================================
           DASHBOARD TITLE
        ============================================ */

        .dashboard-title {

            margin-bottom: 25px;
        }

        .dashboard-title h2 {

            font-size: 28px;

            margin-bottom: 5px;
        }

        .dashboard-title p {

            color: #666;

            font-size: 14px;
        }


        /* ============================================
           STAT CARDS
        ============================================ */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .stat-card {

            background: white;

            padding: 22px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-card h3 {

            font-size: 14px;

            color: #666;

            margin-bottom: 10px;
        }

        .stat-card .number {

            font-size: 30px;

            font-weight: bold;
        }

        .red {
            color: #e60000;
        }

        .green {
            color: #168a16;
        }

        .orange {
            color: #e67e00;
        }

        .blue {
            color: #1261a0;
        }


        /* ============================================
           SECURITY ALERT PANEL
        ============================================ */

        .panel {

            background: white;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);

            margin-bottom: 25px;

            overflow: hidden;
        }

        .panel-header {

            padding: 18px 20px;

            border-bottom:
                1px solid #ddd;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .panel-header h3 {

            font-size: 20px;
        }

        .alert-badge {

            background: #e60000;

            color: white;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;
        }


        /* ============================================
           EMPTY ALERT AREA
        ============================================ */

        .alerts-container {

            padding: 20px;
        }

        .no-alerts {

            text-align: center;

            padding: 45px 20px;

            color: #777;
        }

        .no-alerts .icon {

            font-size: 40px;

            margin-bottom: 10px;
        }


        /* ============================================
           RESPONSIVE
        ============================================ */

        @media (max-width: 900px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .sidebar {

                width: 65px;
            }

            .sidebar button {

                font-size: 0;

                text-align: center;

                padding: 18px 5px;
            }

            .main {

                margin-left: 65px;

                padding: 15px;
            }

            .stats {

                grid-template-columns:
                    1fr;
            }

            .header {

                padding: 15px;
            }

            .header h1 {

                font-size: 18px;
            }

        }

    </style>

</head>


<body>


    <!-- ============================================
         HEADER
    ============================================ -->

    <header class="header">

        <h1>
            PRIYANSHU ROADLINES
        </h1>

        <span>
            ADMIN CONTROL PANEL
        </span>

    </header>



    <!-- ============================================
         SIDEBAR
    ============================================ -->

    <aside class="sidebar">

        <button class="active">
            🏠 Dashboard
        </button>

        <button>
            🔐 Security Alerts
        </button>

        <button>
            👤 Operators
        </button>

        <button>
            📱 Trusted Devices
        </button>

        <button>
            📋 Login History
        </button>

        <button>
            📦 POD Management
        </button>

        <button>
            ⚙️ Settings
        </button>

    </aside>



    <!-- ============================================
         MAIN DASHBOARD
    ============================================ -->

    <main class="main">


        <div class="dashboard-title">

            <h2>
                Admin Dashboard
            </h2>

            <p>
                Monitor and manage PRIYANSHU ROADLINES
                security and system activity.
            </p>

        </div>



        <!-- ========================================
             STATISTICS
        ======================================== -->

        <section class="stats">


            <div class="stat-card">

                <h3>
                    NEW SECURITY ALERTS
                </h3>

                <div
                    class="number red"
                    id="newAlertsCount">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    REVIEWED ALERTS
                </h3>

                <div
                    class="number green"
                    id="reviewedAlertsCount">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    BLOCKED DEVICES
                </h3>

                <div
                    class="number orange"
                    id="blockedDevicesCount">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    TOTAL ALERTS
                </h3>

                <div
                    class="number blue"
                    id="totalAlertsCount">
                    0
                </div>

            </div>


        </section>



        <!-- ========================================
             SECURITY ALERT CENTER
        ======================================== -->

        <section class="panel">


            <div class="panel-header">

                <h3>
                    🔴 Security Alert Center
                </h3>

                <span
                    class="alert-badge"
                    id="alertStatus">
                    NO NEW ALERTS
                </span>

            </div>


            <div
                class="alerts-container"
                id="alertsContainer">


                <div class="no-alerts">

                    <div class="icon">
                        🛡️
                    </div>

                    <p>
                        Security alerts will appear here.
                    </p>

                </div>


            </div>


        </section>


    </main>


</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | PRIYANSHU ROADLINES</title>

    <link rel="stylesheet" href="signin.css">
</head>

<body>

<div class="container">

    <div class="loginBox">

        <img src="images/logo.png" class="logo">

        <h1>PRIYANSHU ROADLINES</h1>

        <h2>Sign In</h2>

        <p class="subtitle">
            Please select your account type
        </p>

        <div class="roleBox">

            <label class="roleCard">

                <input
                    type="radio"
                    name="role"
                    value="user"
                    checked>

                <div class="roleContent">

                    <h3>👤 USER</h3>

                    <p>
                        Customer Portal
                    </p>

                </div>

            </label>

            <label class="roleCard">

                <input
                    type="radio"
                    name="role"
                    value="operator">

                <div class="roleContent">

                    <h3>🧑‍💼 OPERATOR</h3>

                    <p>
                        Staff / Admin
                    </p>

                </div>

            </label>

        </div>

        <button id="continueBtn">
            CONTINUE
        </button>

        <br><br>

        <a href="index.html">
            ← Back to Home
        </a>

    </div>

</div>

<script src="signin.js"></script>

</body>
</html>

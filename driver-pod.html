<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PRIYANSHU ROADLINES - POD Upload</title>

    <link
        rel="icon"
        href="images/logo.png"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .header {
            background: #000;
            color: white;
            text-align: center;
            padding: 18px 15px;
        }

        .header img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 10px;
        }

        .header h1 {
            display: inline-block;
            vertical-align: middle;
            margin: 0;
            color: #fff;
            font-size: 25px;
        }

        .header p {
            margin: 8px 0 0;
            color: #ccc;
            font-size: 13px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 35px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.12);
        }

        .card h2 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 16px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e00000;
        }

        .upload-box {
            border: 2px dashed #bbb;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-top: 8px;
        }

        .upload-box input {
            border: none;
            padding: 0;
        }

        .upload-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #e00000;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-button:hover {
            background: #c00000;
        }

        .upload-button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 14px;
            border-radius: 7px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #e8f7e8;
            color: #167016;
        }

        .error {
            background: #fdeaea;
            color: #b00000;
        }

        .info {
            margin-top: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 7px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        @media (max-width: 600px) {

            .header h1 {
                display: block;
                margin-top: 8px;
                font-size: 22px;
            }

            .header img {
                margin-right: 0;
            }

            .card {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

    <header class="header">

        <img
            src="images/logo.png"
            alt="PRIYANSHU ROADLINES"
        >

        <h1>PRIYANSHU ROADLINES</h1>

        <p>DRIVER POD UPLOAD PORTAL</p>

    </header>


    <main class="container">

        <div class="card">

            <h2>📦 Upload POD</h2>

            <p class="subtitle">
                Submit the POD for your delivered GR/LR.
            </p>


            <form id="driverPodForm">

                <label for="grNo">
                    GR / LR Number
                </label>

                <input
                    type="text"
                    id="grNo"
                    placeholder="Enter GR / LR Number"
                    required
                    autocomplete="off"
                >


                <label for="vehicleNo">
                    Vehicle Number
                </label>

                <input
                    type="text"
                    id="vehicleNo"
                    placeholder="Enter Vehicle Number"
                    required
                    autocomplete="off"
                >


                <label for="driverName">
                    Driver Name
                </label>

                <input
                    type="text"
                    id="driverName"
                    placeholder="Enter Driver Name"
                    required
                    autocomplete="name"
                >


                <label for="podImage">
                    POD Image
                </label>

                <div class="upload-box">

                    <input
                        type="file"
                        id="podImage"
                        accept="image/jpeg,image/png,image/webp"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="submitPodBtn"
                    class="upload-button"
                >
                    ⬆ Submit POD
                </button>

            </form>


            <div
                id="successMessage"
                class="message success"
            ></div>


            <div
                id="errorMessage"
                class="message error"
            ></div>


            <div class="info">

                ⚠️ Each GR / LR can have only one POD request.
                <br>
                Your upload will be reviewed by PRIYANSHU ROADLINES
                before becoming an official POD.

            </div>

        </div>

    </main>


    <script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

    import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


    // =========================================================
    // FIREBASE CONFIG
    // =========================================================

    const firebaseConfig = {

        apiKey: "AIzaSyBQZREq5abr_oLzt6ksMGb-1jhlnKc92pU",

        authDomain:
            "priyanshu-roadlines-pod.firebaseapp.com",

        projectId:
            "priyanshu-roadlines-pod",

        storageBucket:
            "priyanshu-roadlines-pod.firebasestorage.app",

        messagingSenderId:
            "735411516260",

        appId:
            "1:735411516260:web:397d6a80141f032c0a0071"

    };


    // =========================================================
    // INITIALIZE FIREBASE
    // =========================================================

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    // =========================================================
    // ELEMENTS
    // =========================================================

    const form =
        document.getElementById("driverPodForm");

    const submitBtn =
        document.getElementById("submitPodBtn");

    const successMessage =
        document.getElementById("successMessage");

    const errorMessage =
        document.getElementById("errorMessage");


    // =========================================================
    // DEVICE ID
    //
    // This is a browser-generated identifier.
    // It is NOT a permanent hardware serial number.
    // =========================================================

    function getDeviceId() {

        let deviceId =
            localStorage.getItem("driverPodDeviceId");


        if (!deviceId) {

            deviceId =
                "DRV-" +
                crypto.randomUUID();

            localStorage.setItem(
                "driverPodDeviceId",
                deviceId
            );

        }


        return deviceId;

    }


    // =========================================================
    // NORMALIZE GR / LR
    // =========================================================

    function normalizeGR(value) {

        return value
            .trim()
            .toUpperCase()
            .replace(/\s+/g, "");

    }


    // =========================================================
    // HIDE MESSAGES
    // =========================================================

    function hideMessages() {

        successMessage.style.display = "none";

        errorMessage.style.display = "none";

        successMessage.textContent = "";

        errorMessage.textContent = "";

    }


    // =========================================================
    // SHOW ERROR
    // =========================================================

    function showError(message) {

        errorMessage.textContent = message;

        errorMessage.style.display = "block";

        successMessage.style.display = "none";

    }


    // =========================================================
    // SHOW SUCCESS
    // =========================================================

    function showSuccess(message) {

        successMessage.textContent = message;

        successMessage.style.display = "block";

        errorMessage.style.display = "none";

    }


    // =========================================================
    // CHECK BLOCKED DEVICE
    // =========================================================

    async function checkBlockedDevice(deviceId) {

        const deviceRef =
            doc(
                db,
                "blockedDevices",
                deviceId
            );


        const deviceSnapshot =
            await getDoc(deviceRef);


        if (!deviceSnapshot.exists()) {

            return false;

        }


        const data =
            deviceSnapshot.data();


        return data.blocked === true;

    }


    // =========================================================
    // CHECK GR / LR
    //
    // Checks both:
    //
    // pods/{GR}
    // podUploadRequests/{GR}
    //
    // The transaction prevents two requests for the
    // same GR from being created at the same time.
    // =========================================================

   async function createPodRequest(
    grNo,
    vehicleNo,
    driverName,
    deviceId
) {

    const requestRef =
        doc(
            db,
            "podUploadRequests",
            grNo
        );


    await setDoc(
        requestRef,
        {

            grNo:
                grNo,

            vehicleNo:
                vehicleNo,

            driverName:
                driverName,

            deviceId:
                deviceId,

            status:
                "Pending",

            source:
                "driver_portal",

            submittedAt:
                serverTimestamp()

        }
    );

}
               

    // =========================================================
    // FORM SUBMISSION
    // =========================================================

    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            hideMessages();


            // ---------------------------------------------
            // GET VALUES
            // ---------------------------------------------

            const grNo =
                normalizeGR(
                    document
                        .getElementById("grNo")
                        .value
                );


            const vehicleNo =
                document
                    .getElementById("vehicleNo")
                    .value
                    .trim()
                    .toUpperCase();


            const driverName =
                document
                    .getElementById("driverName")
                    .value
                    .trim();


            const imageFile =
                document
                    .getElementById("podImage")
                    .files[0];


            const deviceId =
                getDeviceId();


            // ---------------------------------------------
            // BASIC VALIDATION
            // ---------------------------------------------

            if (!grNo) {

                showError(
                    "Please enter the GR / LR number."
                );

                return;

            }


            if (!vehicleNo) {

                showError(
                    "Please enter the vehicle number."
                );

                return;

            }


            if (!driverName) {

                showError(
                    "Please enter the driver name."
                );

                return;

            }


            if (!imageFile) {

                showError(
                    "Please select the POD image."
                );

                return;

            }


            // ---------------------------------------------
            // IMAGE TYPE CHECK
            // ---------------------------------------------

            const allowedTypes = [

                "image/jpeg",

                "image/png",

                "image/webp"

            ];


            if (
                !allowedTypes.includes(
                    imageFile.type
                )
            ) {

                showError(
                    "Only JPG, PNG or WebP images are allowed."
                );

                return;

            }


            // ---------------------------------------------
            // IMAGE SIZE CHECK
            // ---------------------------------------------

            if (
                imageFile.size >
                10 * 1024 * 1024
            ) {

                showError(
                    "POD image must be smaller than 10 MB."
                );

                return;

            }


            // ---------------------------------------------
            // DISABLE BUTTON
            // ---------------------------------------------

            submitBtn.disabled = true;

            submitBtn.textContent =
                "Checking...";


            try {

                // -----------------------------------------
                // CHECK DEVICE BLOCK
                // -----------------------------------------

                const blocked =
                    await checkBlockedDevice(
                        deviceId
                    );


                if (blocked) {

                    showError(
                        "This device is blocked from submitting POD requests."
                    );

                    return;

                }


                // -----------------------------------------
                // CREATE PENDING REQUEST
                // -----------------------------------------

                submitBtn.textContent =
                    "Submitting...";


                await createPodRequest(
                    grNo,
                    vehicleNo,
                    driverName,
                    deviceId
                );


                // -----------------------------------------
                // SUCCESS
                // -----------------------------------------

                showSuccess(
                    "POD request submitted successfully. It will be reviewed by PRIYANSHU ROADLINES."
                );


                form.reset();


            }
            catch (error) {

                console.error(
                    "Driver POD submission error:",
                    error
                );


                if (
                    error.message ===
                    "GR_ALREADY_EXISTS"
                ) {

                    showError(
                        "This GR / LR already has an official POD."
                    );

                }
                else if (
                    error.message ===
                    "REQUEST_ALREADY_EXISTS"
                ) {

                    showError(
                        "A POD request for this GR / LR is already pending."
                    );

                }
                else {

                    showError(
                        "Unable to submit the POD request. Please try again."
                    );

                }

            }
            finally {

                submitBtn.disabled = false;

                submitBtn.textContent =
                    "⬆ Submit POD";

            }

        }
    );


    console.log(
        "Driver POD Portal Firebase initialized."
    );

</script>

</body>

</html>

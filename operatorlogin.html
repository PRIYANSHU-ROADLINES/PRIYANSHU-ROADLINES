<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Operator Login</title>

<link rel="stylesheet"
href="userlogin.css">

</head>

<body>

<div class="container">

<div class="loginBox">

<img src="images/logo.png"
class="logo">

<h1>PRIYANSHU ROADLINES</h1>

<h2>Operator Login</h2>

<p>

Only Staff & Admin

</p>

<label>Mobile Number</label>

<input
type="tel"
id="mobile"
maxlength="10"
placeholder="Enter Mobile Number">

<label>Full Name</label>

<input
type="text"
id="fullname"
placeholder="Enter Full Name">

<label>Official Email</label>

<input
type="email"
id="email"
placeholder="Official Email">

<label>Unique Code</label>

<input
type="password"
id="uniqueCode"
placeholder="Unique Code">

<button id="verifyBtn">

Continue

</button>

<br><br>

<a href="signin.html">

← Back

</a>

</div>

</div>

<script type="module"
src="operatorlogin.js"></script>

</body>

</html>
